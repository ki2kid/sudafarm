server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://sudafarm.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_name sudafarm.onrender.com;
        proxy_set_header Host sudafarm.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        proxy_pass https://sudafarm.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_name sudafarm.onrender.com;
        proxy_set_header Host sudafarm.onrender.com;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri /index.html;
    }
}